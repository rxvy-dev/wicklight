name: build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Full-campaign autoplay test
        run: ./build.sh test
      - name: Portable release
        run: pip install ziglang && ./build.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: wicklight-linux-x86_64
          path: dist/*
